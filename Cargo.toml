[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dan Murfitt"]
repository = "https://github.com/danmurf/rasp"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true